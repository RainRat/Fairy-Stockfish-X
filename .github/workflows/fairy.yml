name: fairy
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  fairy:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      CXX: ${{ matrix.config.compiler }}
      COMP: ${{ matrix.config.comp }}
      CXXFLAGS: "-Werror"
      FSX_ENGINE_FAMILY: large
    strategy:
      matrix:
        config:
          - {
              name: "Ubuntu 24.04 GCC",
              os: ubuntu-24.04,
              compiler: g++,
              comp: gcc,
              run_expensive_tests: true
            }
          - {
              name: "Ubuntu 24.04 Clang",
              os: ubuntu-24.04,
              compiler: clang++,
              comp: clang,
              run_expensive_tests: false
            }

    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download required packages
        run: |
          sudo apt update
          sudo apt install -y expect

      - name: Download the used network from the fishtest framework
        run: |
          make net

      - name: Test NNUE
        run: |
          make clean
          make -j2 ARCH=x86-64 nnue=yes debug=yes build
          ./stockfish bench

      - name: Test NNUE largeboards
        run: |
          make clean
          make -j2 ARCH=x86-64 largeboards=yes nnue=yes debug=yes build
          ./stockfish bench

      - name: Build all variants
        run: |
          make clean
          make -j2 ARCH=x86-64 largeboards=yes all=yes debug=yes EXE=stockfish-allvars build

      - name: Test variants.ini
        run: |
          set +e
          diagnostics=$(./stockfish-allvars check variants.ini 2>&1 >/dev/null)
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$diagnostics"
            exit "$status"
          fi
          if grep -Ev "Parsing variant|Variant template '.*' does not exist\.|exceeds build board limits \(maxFile=.*\)\. Skipping\.|Castling destination is adjacent to castlingKingFile; some GUIs/protocols may not distinguish castling from a normal king move\.|Can not use kings with blastOnCapture\.|Can not use kings, pseudo-royal, or anti-royal with blastImmuneTypes\.|Variant 'kamikaze' has invalid configuration\. Skipping\.|Variant '.*' requires an all=yes build\. Skipping\.|checking=false with allowChecks=true is unusual: king safety is disabled, so the no-check rule will not constrain legality\." <<< "$diagnostics"; then
            exit 1
          fi

      - name: Test variant perft
        run: |
          ../tests/perft.sh all ./stockfish-allvars

      - name: Test fast semantic profile
        run: |
          ../tests/run.sh fast ./stockfish-allvars

      - name: Test search and evaluation regressions
        if: ${{ matrix.config.run_expensive_tests }}
        run: |
          ../tests/run.sh suite search-evaluation ./stockfish-allvars

      - name: Test variant bench
        run: |
          ./stockfish-allvars bench minixiangqi
          ./stockfish-allvars bench minishogi
          ./stockfish-allvars bench sittuyin
          if [[ "$COMP" == "gcc" ]]; then
            ./stockfish-allvars bench xiangqi
            ./stockfish-allvars bench shogi
            ./stockfish-allvars bench capablanca
          fi

      - name: Test Arimaa profile and referee
        working-directory: .
        run: |
          bash tests/suites/cases/variants-smoke/arimaa-profile.inc src/stockfish-allvars src/variants.ini
          python3 -m unittest tests/python/test_arimaa_tournament.py
