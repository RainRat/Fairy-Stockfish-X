# [minishogi]
# variantTemplate = shogi
# maxRank = 5
# maxFile = 5
# shogiPawn = p
# silver = s
# gold = g
# bishop = b
# dragonHorse = h
# rook = r
# bers = d
# king = k
# startFen = rbsgk/4p/5/P4/KGSBR[-] w 0 1
# pieceDrops = true
# captureType = hand
# promotionRegionWhite = *5
# promotionRegionBlack = *1
# doubleStep = false
# castling = false
# promotedPieceType = p:g s:g b:h r:d
# dropNoDoubled = p
# immobilityIllegal = true
# shogiPawnDropMateIllegal = true
# stalemateValue = loss
# nFoldRule = 4
# nMoveRule = 0
# perpetualCheckIllegal = true
# pocketSize = 5
# nFoldValue = loss
# nFoldValueAbsolute = true

### Variant definitions

# Hybrid/drop variants and early rule mashups

# Arimaa profile using generic compound turns.
#
# Setup uses the standard Arimaa two-rank placement phase. In a compoundturns=yes
# build, once both pockets are empty, a turn contains one to four same-side
# steps and is sent as one move token (steps separated by commas; semicolons
# are also accepted). Partial turns are an engine-internal search detail and
# are not represented in serialized FEN.
# Setup placement is deterministic: the engine selects the first legal
# placement rather than searching setup positions.
# sequentialSetup keeps the standard same-side placement phase. Set it false
# to use ordinary drop-side transitions while retaining multipart turns.
# pushPullRule selects the push/pull representation and step accounting;
# `two-step` uses the encoded two-step form, while generic and none are available
# for rule experiments.
# In two-step push/pull mode, freezeStrength is the pusher-versus-target hierarchy;
# pushingStrength remains the generic line-push hierarchy.
# simulFlagExtinctionWinner selects the winner when flag and extinction results
# are checked at an adjudication boundary. flag-first-active-first checks the
# player who just moved first, then the player to move.
[arimaa]
sequentialSetup = true
pieceToCharTable = RCDHMErcdhme
pawn = -
knight = -
bishop = -
rook = -
queen = -
king = -
customPiece1 = r:mfsW
customPiece2 = c:mW
customPiece3 = d:mW
customPiece4 = h:mW
